apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: broadcast-direct-user
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get"]
  # The verb follows the HTTP method: GET and HEAD get, POST create, PUT update, PATCH patch, DELETE delete.
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # Uncomment for --headers-from-secret, ideally limited with resourceNames.
  # - apiGroups: [""]
  #   resources: ["secrets"]
  #   verbs: ["get"]
