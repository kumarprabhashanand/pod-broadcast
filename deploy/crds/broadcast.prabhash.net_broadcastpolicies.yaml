              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              allow:
                description: |-
                  A broadcast passes when its request, and its revert, each match one rule on target, port,
