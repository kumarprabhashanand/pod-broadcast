---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: broadcastpolicies.broadcast.prabhash.net
spec:
  group: broadcast.prabhash.net
  names:
    categories:
    - pod-broadcast
    kind: BroadcastPolicy
    listKind: BroadcastPolicyList
    plural: broadcastpolicies
    shortNames:
    - bcp
    singular: broadcastpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BroadcastPolicy limits what broadcasts in its namespace may call.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BroadcastPolicySpec says what broadcasts in the namespace
              may call.
            properties:
              allow:
                description: |-
                  A broadcast passes when its request, and its revert, each match one rule on target, port,
                  method and path together.
                items:
                  description: Rule allows a set of methods and paths on a set of
                    targets and ports.
                  properties:
                    methods:
                      description: HTTP methods, compared without regard to case.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    paths:
                      description: |-
                        RE2 patterns matched against the whole path and query. Paths with "." or ".." segments, ";",
                        a backslash, or percent-encoded ".", "/", backslash or "%" are refused, so that no server reads
                        them as a path the pattern doesn't allow.
                      items:
                        type: string
                      minItems: 1
                      type: array
                    ports:
                      description: Port names or numbers. Names are resolved on each
                        pod, so a number matches the name it stands for.
                      items:
                        anyOf:
                        - type: integer
                        - type: string
                        x-kubernetes-int-or-string: true
                      minItems: 1
                      type: array
                    targets:
                      description: Targets such as svc/orders or deploy/orders; "*"
                        matches any target, including selectors.
                      items:
                        type: string
                      minItems: 1
                      type: array
                  required:
                  - methods
                  - paths
                  - ports
                  - targets
                  type: object
                minItems: 1
                type: array
              limits:
                description: Limits caps execution settings and durations; with several
                  policies, the strictest wins.
                properties:
                  defaultDuration:
                    description: DefaultDuration of a Continuous broadcast that sets
                      none.
                    type: string
                    x-kubernetes-validations:
                    - message: defaultDuration must be positive
                      rule: duration(self) > duration('0s')
                  maxConcurrency:
                    description: MaxConcurrency is the highest execution.concurrency
                      allowed.
                    format: int32
                    minimum: 1
                    type: integer
                  maxDuration:
                    description: MaxDuration is the longest Continuous broadcast allowed.
                    type: string
                    x-kubernetes-validations:
                    - message: maxDuration must be positive
                      rule: duration(self) > duration('0s')
                  maxRetries:
                    description: MaxRetries is the highest execution.retries allowed.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              secrets:
                description: Secrets broadcasts may use in headersFromSecrets.
                items:
                  type: string
                type: array
            required:
            - allow
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
