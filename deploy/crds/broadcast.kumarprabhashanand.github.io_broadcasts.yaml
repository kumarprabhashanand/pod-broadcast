              rule: self == oldSelf
            - message: duration and revert need mode Continuous
              rule: self.mode == 'Continuous' || (!has(self.duration) && !has(self.revert))
          status:
            properties:
              expiresAt:
                format: date-time
                type: string
              finishedAt:
                format: date-time
                type: string
              message:
                description: Message explains a Rejected or Failed phase.
                type: string
              phase:
                type: string
              pods:
                items:
                  properties:
                    attempts:
                      format: int32
                      type: integer
                    body:
                      description: Body is the start of the response, at most 256
