                      type: string
                    code:
                      format: int32
                      type: integer
                    durationMs:
                      format: int64
                      type: integer
                    error:
                      type: string
                    ip:
                      type: string
                    name:
                      type: string
                    port:
                      format: int32
                      type: integer
                    scheme:
                      type: string
                    state:
                      type: string
                    uid:
                      type: string
                  required:
                  - name
                  - state
                  - uid
                  type: object
                type: array
              startedAt:
                format: date-time
                type: string
              summary:
                properties:
                  failed:
                    format: int32
                    type: integer
                  gone:
                    format: int32
                    type: integer
                  revertFailed:
                    format: int32
                    type: integer
                  reverted:
                    format: int32
                    type: integer
                  succeeded:
                    format: int32
                    type: integer
                  targeted:
                    format: int32
                    type: integer
                required:
